<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="same-origin"><title>Checkout | Shervinah Universal</title><link rel="stylesheet" href="styles.css?v=commerce-1"><link rel="stylesheet" href="commerce.css?v=store-5"></head>
<body><header class="checkout-header"><a href="shop.html">SHERVINAH UNIVERSAL</a><div><button type="button" data-checkout-lang="en">EN</button><button type="button" data-checkout-lang="fa">فارسی</button></div></header>
<main class="checkout-shell"><h1 data-en="Your order" data-fa="سفارش شما">Your order</h1><p data-en="No account needed. 1. Review your cart · 2. Delivery details · 3. Secure payment" data-fa="بدون نیاز به حساب کاربری. ۱. بررسی سبد · ۲. نشانی ارسال · ۳. پرداخت امن">No account needed. 1. Review your cart · 2. Delivery details · 3. Secure payment</p><p id="checkout-status" role="status" aria-live="polite"></p>
<div id="checkout-content" class="checkout-grid"><section class="checkout-panel"><h2 data-en="Items & delivery" data-fa="محصولات و ارسال">Items & delivery</h2><div id="checkout-items"></div><p><a href="shop.html" data-en="Continue shopping" data-fa="ادامه خرید">Continue shopping</a></p>
<form id="checkout-form"><label><span data-en="Destination country" data-fa="کشور مقصد">Destination country</span><select name="country" id="checkout-country" required><option value="">Choose a country</option></select></label>
<label id="region-label" hidden><span data-en="Portugal region" data-fa="منطقه پرتغال">Portugal region</span><select name="region" id="checkout-region"><option value="mainland">Mainland / سرزمین اصلی</option><option value="azores">Azores / آزور</option><option value="madeira">Madeira / مادیرا</option></select></label>
<label><span data-en="Full name" data-fa="نام و نام خانوادگی">Full name</span><input name="name" autocomplete="shipping name" required maxlength="180"></label>
<label><span data-en="Email" data-fa="ایمیل">Email</span><input name="email" type="email" autocomplete="email" required maxlength="190"></label>
<label><span data-en="Phone" data-fa="تلفن">Phone</span><input name="phone" type="tel" autocomplete="shipping tel" required maxlength="60"></label>
<label><span data-en="Street address and apartment" data-fa="آدرس و شماره واحد">Street address and apartment</span><input name="address" autocomplete="shipping street-address" required maxlength="300"></label>
<label><span data-en="City" data-fa="شهر">City / state or province</span><input name="city" autocomplete="shipping address-level2" required maxlength="120"></label>
<label id="state-label"><span data-en="State / province" data-fa="استان / ایالت">State / province</span><input name="state" autocomplete="shipping address-level1" maxlength="120"></label>
<label><span data-en="Postal code (enter N/A if none)" data-fa="کد پستی (اگر ندارید N/A وارد کنید)">Postal code (enter N/A if none)</span><input name="postal_code" autocomplete="shipping postal-code" required maxlength="30"></label>
<label class="checkout-consent"><input type="checkbox" name="consent" required><span><span data-en="I agree to the order total and the " data-fa="مبلغ سفارش و این شرایط را می‌پذیرم: ">I agree to the order total and the </span><a href="terms.html" target="_blank" rel="noopener" data-en="terms" data-fa="شرایط">terms</a>, <a href="shipping.html" target="_blank" rel="noopener" data-en="shipping policy" data-fa="شرایط ارسال">shipping policy</a> &amp; <a href="privacy.html" target="_blank" rel="noopener" data-en="privacy policy" data-fa="حریم خصوصی">privacy policy</a>.</span></label>
<button id="checkout-pay" class="button button-primary" type="submit" disabled data-en="Continue to secure card payment" data-fa="ادامه به پرداخت امن با کارت">Continue to secure card payment</button>
<p data-en="Card details are entered only on Cardcom’s secure payment page. Payment is charged in US dollars." data-fa="اطلاعات کارت فقط در صفحه امن کاردکام وارد می‌شود. پرداخت به دلار آمریکا انجام می‌شود.">Card details are entered only on Cardcom’s secure payment page. Payment is charged in US dollars.</p></form></section>
<aside class="checkout-panel checkout-summary"><h2 data-en="Order summary" data-fa="خلاصه سفارش">Order summary</h2><div id="checkout-summary"></div><p id="checkout-note"></p><a href="shop.html" data-en="Continue shopping" data-fa="ادامه خرید">Continue shopping</a></aside></div></main><script src="store-ui.js?v=store-5"></script><script src="commerce.js?v=store-5"></script></body></html>
